name: Ensure Changeset File

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
    branches: [main, develop]

permissions:
  contents: write
  pull-requests: read

jobs:
  ensure-changeset:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      AUTO_CHANGESET_FILE: .changeset/pr-${{ github.event.pull_request.number }}.md
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Sync generated changeset
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess

          auto_file = os.environ["AUTO_CHANGESET_FILE"]
          auto_path = pathlib.Path(auto_file)
          base_ref = f'origin/{os.environ["BASE_REF"]}'
          pr_number = os.environ["PR_NUMBER"]
          pr_title = os.environ["PR_TITLE"].strip()

          diff = subprocess.run(
              ["git", "diff", "--name-only", f"{base_ref}...HEAD", "--", ".changeset"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()

          manual_changesets = [
              path
              for path in diff
              if path.startswith(".changeset/")
              and path.endswith(".md")
              and path not in {".changeset/README.md", auto_file}
          ]

          if manual_changesets:
              if auto_path.exists():
                  auto_path.unlink()
                  subprocess.run(["git", "add", "-A", "--", auto_file], check=True)
                  print(
                      "Removed autogenerated changeset because manual changesets are present:",
                      ", ".join(manual_changesets),
                  )
              else:
                  print(
                      "Manual changeset already present; skipping autogenerated file:",
                      ", ".join(manual_changesets),
                  )
          else:
              auto_path.write_text(
                  f'---\n"portfolio-v2": patch\n---\n\n{pr_title} (#{pr_number})\n',
                  encoding="utf-8",
              )
              subprocess.run(["git", "add", "--", auto_file], check=True)
              print(f"Synced autogenerated changeset at {auto_file}")
          PY

      - name: Commit changeset update
        run: |
          if git diff --cached --quiet; then
            echo "No changeset update required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync changeset for PR #${PR_NUMBER}"
          git push origin "HEAD:${HEAD_REF}"
