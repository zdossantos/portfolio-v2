name: Release

on:
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request
        id: release_pr
        uses: changesets/action@v1
        continue-on-error: ${{ secrets.CHANGESETS_GITHUB_TOKEN == '' }}
        with:
          title: "chore: version packages"
          commit: "chore: version packages"
          branch: main
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_GITHUB_TOKEN != '' && secrets.CHANGESETS_GITHUB_TOKEN || github.token }}

      - name: Explain release PR token requirement
        if: ${{ steps.release_pr.outcome == 'failure' && secrets.CHANGESETS_GITHUB_TOKEN == '' }}
        run: |
          {
            echo "Changesets prepared the release branch but could not open the release pull request with the default GitHub Actions token."
            echo
            echo "To re-enable automatic release PR creation, either:"
            echo '- enable "Allow GitHub Actions to create and approve pull requests" in repository Actions settings; or'
            echo "- add a CHANGESETS_GITHUB_TOKEN secret backed by a PAT or GitHub App token with pull request permissions."
          } >> "$GITHUB_STEP_SUMMARY"
